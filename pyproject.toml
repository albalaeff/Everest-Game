[project]
name = "myapp"
version = "0.1.0"
description = "A project started from claude-workflow-template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "psutil",
    "ruff",
    "mypy",
]
# What the scripts need, installed with every sync (`default-groups`): release-cut.yml runs
# scripts/github.py with --no-dev.
tools = [
    "httpx",
    "python-dotenv",
    "tzdata",  # time zones on Windows: the usage limit's reset time (scripts/agent_manager.py)
]
# The agent manager's per-agent test databases (agent-manager.toml → test_database_url):
# `uv sync --group db` on a machine that runs the manager for a project with a database.
db = [
    "asyncpg",
]

[tool.uv]
default-groups = ["dev", "tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myapp"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Reference copies from PersonalExchangeBot, to adapt, not to run (optional/README.md).
extend-exclude = ["optional"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["myapp"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^optional/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# In parallel: as many workers as the cores and memory allow (tests/parallel.py). `-n 0`: in
# one process.
addopts = "-ra --strict-markers -n auto"
filterwarnings = [
    # Deprecations fail the build, so they're fixed while they're still small.
    "error::DeprecationWarning",
]
markers = [
    "unit: pure tests with no I/O",
    "db: tests that need the PostgreSQL test database",
]
