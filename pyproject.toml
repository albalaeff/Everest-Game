[project]
name = "everest"
version = "0.1.0"
description = "Everest, a browser simulator-trainer for climbing Everest: this Python side runs the workflow's scripts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
    "psutil",
    "ruff",
    "mypy",
    "jsonschema",  # the knowledge base's check (scripts/check_facts.py)
    "types-jsonschema",
]
# What the scripts need, installed with every sync (`default-groups`): release-cut.yml runs
# scripts/github.py with --no-dev.
tools = [
    "httpx",
    "python-dotenv",
    "tzdata",  # time zones on Windows: the usage limit's reset time (scripts/agent_manager.py)
]
# The agent manager's per-agent test databases (agent-manager.toml → test_database_url):
# `uv sync --group db` on a machine that runs the manager for a project with a database.
db = [
    "asyncpg",
]

[tool.uv]
default-groups = ["dev", "tools"]
# Nothing to build: the game is TypeScript (spec.md), and this side is the workflow's scripts
# (scripts/) and their tests (tests/), run from the checkout.
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["scripts", "tests"]

[tool.mypy]
python_version = "3.14"
strict = true

# asyncpg: in the `db` group, which CI doesn't install, and untyped where it is.
[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The checkout on sys.path: `from scripts…` and `from tests…` import without an installed package.
pythonpath = ["."]
# In parallel: as many workers as the cores and memory allow (tests/parallel.py). `-n 0`: in
# one process.
addopts = "-ra --strict-markers -n auto"
filterwarnings = [
    # Deprecations fail the build, so they're fixed while they're still small.
    "error::DeprecationWarning",
]
markers = [
    "unit: pure tests with no I/O",
    "db: tests that need the PostgreSQL test database",
]
