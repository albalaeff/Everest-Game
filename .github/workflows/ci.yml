name: CI

# Every pull request is checked before it may be merged; develop and master are checked
# again after each merge. Task branches aren't checked on push: their PR is. A release PR,
# into master, then goes live on trial (`deploy`, PEB#510).
on:
  pull_request:
  push:
    branches: [develop, master]
  workflow_dispatch:

concurrency:
  # One run per PR (a newer push cancels the older run); merges to develop/master all run. A
  # release PR's run is never cut off, since it may be deploying: the newer one waits for it.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.base_ref != 'master' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy scripts

      - name: Tests
        run: uv run pytest

      # The game's own checks (README → Tests), in this job because the ruleset requires it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the game's dependencies
        run: npm ci

      - name: Lint the game
        run: npm run lint

      - name: Check the game's format
        run: npm run format:check

      - name: Type check the game
        run: npm run typecheck

      - name: Test the game
        run: npm test

      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test the page on a PC and on phones
        run: npm run e2e
        env:
          WRANGLER_SEND_METRICS: "false"

  repeat:
    # Temporary, for #154, out before the merge: the two stories that timed out, twenty times
    # each, on the fix, with develop's graphics of #159.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the game's dependencies
        run: npm ci

      - name: Install the browsers
        run: npx playwright install --with-deps chromium

      - name: The two stories, twenty times each
        run: npx playwright test e2e/controls.spec.ts:140 e2e/room.spec.ts:30 --project=pc --project=android --repeat-each=20
        env:
          WRANGLER_SEND_METRICS: "false"

  secrets:
    # No secret in the history (PEB#59, PEB#538): gitleaks over every commit of what's checked
    # out, a PR's with develop's or what's live on a push, but for the findings .gitleaksignore
    # lists. Not every branch's (PEB#546): a stray branch's finding would fail every PR. It
    # prints what it finds redacted: the log is as public as the repository.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          release=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "$release/$archive"
          curl -sSfLO "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$archive" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Scan the history
        run: gitleaks git --redact --verbose --no-banner

  preview:
    # Every merge into develop goes on GitHub Pages once the rest has passed, with its room
    # server on Cloudflare first (docs/production.md → The preview). Run by hand on develop, it
    # publishes develop again.
    needs: [checks, secrets]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the game's dependencies
        run: npm ci

      # Before the page: a page of this build finds a room server of its own build.
      - name: Deploy the room server
        run: npx wrangler deploy --var GAME_VERSION:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"

      - name: Build the game
        run: npm run build
        env:
          VITE_COMMIT: ${{ github.sha }}
          VITE_ROOM_SERVER: https://everest-room.alexalbalaeff.workers.dev

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

  deploy:
    # A release PR goes live on trial once the rest has passed, so merging it confirms a
    # release that runs (docs/production.md → A release). Any other PR into master fails here.
    needs: [checks, secrets]
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    uses: ./.github/workflows/release-tool.yml
    with:
      command: deploy
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
