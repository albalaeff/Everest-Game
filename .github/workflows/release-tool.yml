name: Release tool

# A release PR's deploy (`deploy` once its checks pass, ci.yml), its confirm once it's merged
# and its rollback once it's closed unmerged (release.yml). This is the shape of PEB#510,
# where a tool on the production host did each step over SSH, with a key that could run
# nothing else, and its report went on the PR as a comment. Until this project has a host,
# the last step is a stub: it says so on the PR and passes, so the release flow (the cut, the
# PR, the merge) works from day one. docs/production.md → Setting up the pipeline says how to
# fill it in.
on:
  workflow_call:
    inputs:
      command:
        description: deploy, confirm or rollback
        required: true
        type: string

jobs:
  release-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
      SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      COMMAND: ${{ inputs.command }}

    steps:
      - name: Only a release branch goes to master
        run: |
          case "$BRANCH" in
            release/*) ;;
            *)
              echo "::error::Only a release/... branch goes into master, and $BRANCH isn't one: scripts/github.py release cuts one (docs/production.md → A release)."
              exit 1
              ;;
          esac

      - name: The report on the PR
        # The stub. The real tool runs here, over SSH, and its report (stdout) is the comment:
        # docs/production.md → Setting up the pipeline.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$COMMAND" in
            deploy)
              said="**Not deployed:** no host is set up yet (docs/production.md). Once there is one, the release at $SHA goes live on trial here; **merge** this PR to confirm the release, or **close** it to drop it."
              ;;
            confirm)
              said="**Confirmed** (no host yet): $SHA is the stable release."
              ;;
            rollback)
              said="**Rolled back** (no host yet): $SHA never went live."
              ;;
            *)
              echo "::error::unknown command: $COMMAND"
              exit 1
              ;;
          esac
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$said"
