name: Release cut

# The label `release` on an issue cuts a release, from GitHub itself (docs/production.md → A
# release, #517): `scripts/github.py release --issue <n>` makes release/<date>-NN at develop's
# tip and opens its PR into master, as on a laptop, then says on the issue what came of it and
# closes it. From there the release lives on its PR: CI puts it on prod on trial.
on:
  issues:
    types: [labeled]

concurrency:
  # One at a time, none cut off: of two labels at once, the second finds the first's PR open.
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    if: github.event.label.name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      ISSUE: ${{ github.event.issue.number }}

    steps:
      - name: A person's token
        # A PR opened with Actions' own token starts no CI, so the release would never deploy.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            why="The secret \`RELEASE_TOKEN\` isn't set (docs/production.md → Setting up the pipeline)."
            again="Once it is, take the label off and put it back."
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "**Not cut:** $why $again"
            echo "::error::$why"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Cut it
        id: cut
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: uv run --locked --no-dev python scripts/github.py release --issue "$ISSUE"

      - name: Say on the issue it failed
        # Refused, it said why there itself; this is for an error (the token expired, say).
        if: failure() && steps.cut.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "**Not cut:** the cut failed: [the run]($RUN) says why. Once that's fixed, take the label off and put it back."
