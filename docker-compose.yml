# Local development database, for a project that has one (docs/conventions.md → Tests).
#   Start:  docker compose up -d db
#   Stop:   docker compose down        (keeps the data)
#   Reset:  docker compose down -v     (DELETES the pgdata volume and all dev data)
# A project without a database deletes this file and docker/ (scripts/instantiate.py --no-db).
name: myapp

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: myapp
      POSTGRES_DB: myapp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run only when the volume is empty (first start or after `down -v`).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
