<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Everest</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="slope"></div>
    <main>
      <header>
        <div id="readouts" aria-label="Expedition instruments">
          <span class="readout">
            <span class="readout-label">Mountain time</span>
            <strong id="readout-clock">--:--</strong>
          </span>
          <span class="readout">
            <span class="readout-label">Altitude</span>
            <strong id="readout-altitude">-- m</strong>
          </span>
          <span class="readout readout--muted">
            <span class="readout-label">O₂ bottle</span>
            <strong id="readout-pressure">Not connected</strong>
          </span>
          <span class="readout" id="readout-sun-box" data-state="cold">
            <span class="readout-label">Sun on the ice</span>
            <strong id="readout-sun">--</strong>
          </span>
        </div>
        <p id="fps"></p>
      </header>
      <p id="hint-click"></p>
      <p id="hint-tap"></p>
      <div id="coach" role="status" aria-live="polite" hidden>
        <div class="coach__body">
          <p class="coach__words" data-device="pc"></p>
          <p class="coach__words" data-device="touch"></p>
          <ol class="coach__steps" hidden></ol>
          <ul class="coach__gear" hidden></ul>
        </div>
      </div>
      <p id="mark" aria-hidden="true" hidden>
        <span class="mark__ring"></span>
        <span class="mark__name"></span>
      </p>
      <p id="pointer" aria-hidden="true" hidden>
        <span class="pointer__ring"></span>
        <span class="pointer__arrow">
          <span class="pointer__words" data-device="pc"></span>
          <span class="pointer__words" data-device="touch"></span>
        </span>
      </p>
      <p id="sherpa" role="status" aria-live="polite" hidden>
        <strong data-text="who"></strong>
        <span data-text="said"></span>
      </p>
      <ol id="received"></ol>
      <div id="controls">
        <div class="menu"></div>
        <div class="oxygen"><output id="oxygen-flow">0 L/min</output></div>
        <div class="view"><output></output></div>
        <div class="thumb"></div>
      </div>
      <section
        id="self-check"
        role="dialog"
        aria-modal="false"
        aria-labelledby="self-check-title"
        hidden
      >
        <div class="self-check__header">
          <div>
            <p class="eyebrow">Body status</p>
            <h2 id="self-check-title">Self-check</h2>
          </div>
          <button type="button" aria-label="Close self-check">Close</button>
        </div>
        <dl>
          <div>
            <dt>Symptoms</dt>
            <dd id="self-check-symptoms">No symptoms</dd>
          </div>
          <div>
            <dt>Pulse oximeter</dt>
            <dd id="self-check-oximeter">--%</dd>
          </div>
          <div>
            <dt>Finger colour</dt>
            <dd id="self-check-fingers">--</dd>
          </div>
        </dl>
      </section>
      <button type="button" id="tent-door" hidden>
        <kbd>T</kbd>
        <span data-text="enter"></span>
      </button>
      <section id="tent" role="dialog" aria-modal="true" aria-labelledby="tent-title" hidden>
        <div class="tent-stage"></div>
        <div class="tent-panel">
          <div class="tent-head">
            <div class="tent-where">
              <p class="eyebrow" data-text="where"></p>
              <h2 id="tent-title" data-text="title"></h2>
            </div>
            <div class="tent-time">
              <output class="tent-clock" data-text="clock"></output>
              <p class="tent-slept tent-chip" data-mark="moon" hidden>
                <i aria-hidden="true"></i><span data-text="slept"></span>
              </p>
            </div>
            <ul class="tent-feel" data-text="feel"></ul>
            <button type="button" class="tent-leave" data-act="leave" data-mark="door">
              <i aria-hidden="true"></i><span></span>
            </button>
          </div>
          <ul class="tent-stock">
            <li data-stock="water">
              <span class="tent-name"></span><i class="tent-gauge"><b></b></i><output></output>
            </li>
            <li data-stock="gas">
              <span class="tent-name"></span><i class="tent-gauge"><b></b></i><output></output>
            </li>
            <li data-stock="meals"><span class="tent-name"></span><output></output></li>
            <li data-stock="bars"><span class="tent-name"></span><output></output></li>
            <li data-stock="oxygen"><span class="tent-name"></span><output></output></li>
          </ul>
          <ul class="tent-chores"></ul>
          <div class="tent-foot">
            <div class="tent-quick">
              <button type="button" data-act="drink" data-mark="bottle">
                <i aria-hidden="true"></i><span></span>
              </button>
              <button type="button" data-act="eat" data-mark="bar">
                <i aria-hidden="true"></i><span></span>
              </button>
              <button type="button" data-act="pack" data-mark="pack">
                <i aria-hidden="true"></i><span></span>
              </button>
              <button type="button" data-act="devices" data-mark="radio" aria-expanded="false">
                <i aria-hidden="true"></i><span></span>
              </button>
            </div>
            <p class="tent-note tent-chip" data-mark="warning" hidden>
              <i aria-hidden="true"></i><span data-text="note"></span>
            </p>
          </div>
        </div>
      </section>
      <section
        id="inventory"
        role="dialog"
        aria-modal="false"
        aria-labelledby="inventory-title"
        hidden
      >
        <div class="self-check__header">
          <div>
            <p class="eyebrow" data-text="eyebrow"></p>
            <h2 id="inventory-title" data-text="panel-title"></h2>
          </div>
          <button type="button" data-text="close"></button>
        </div>
        <p id="inventory-where"></p>
        <ul id="inventory-items" class="pack-items"></ul>
        <ul id="inventory-worn" class="worn"></ul>
        <div class="pack-load">
          <p id="inventory-weight" class="pack-weight"></p>
          <div class="pack-meter"><i id="inventory-meter"></i></div>
        </div>
      </section>
      <section id="devices" role="dialog" aria-modal="false" aria-labelledby="devices-title" hidden>
        <div class="self-check__header">
          <div>
            <p class="eyebrow" data-text="eyebrow"></p>
            <h2 id="devices-title" data-text="title"></h2>
          </div>
          <button type="button" data-act="close" data-text="close"></button>
        </div>
        <div class="devices__tabs" role="tablist"></div>
        <div class="device" data-device="radio" role="tabpanel" hidden>
          <div class="radio__device">
            <div class="device__body radio">
              <div class="device__screen radio__lcd" data-contact="yes">
                <span class="radio__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span class="radio__air" data-read="air"></span>
                <span class="radio__battery" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="radio__channel" data-read="channel"></span>
                <span class="radio__name" data-text="radio.channel"></span>
              </div>
            </div>
            <p class="radio__contact" data-read="contact" role="status"></p>
          </div>
          <div class="radio__side">
            <ol class="radio__log" aria-live="polite"></ol>
            <div class="radio__phrases"></div>
          </div>
        </div>
        <div class="device" data-device="gps" role="tabpanel" hidden>
          <div class="device__body watch">
            <div class="device__screen watch__screen" data-fix="yes">
              <p class="watch__where" data-read="where" role="status"></p>
              <div class="watch__page" data-page="altitude">
                <span class="watch__label" data-text="gps.altitude"></span>
                <strong class="watch__big" data-read="altitude"></strong>
                <dl class="watch__pair">
                  <div>
                    <dt data-text="gps.rate"></dt>
                    <dd data-read="rate"></dd>
                  </div>
                  <div>
                    <dt data-text="gps.to-climb"></dt>
                    <dd data-read="to-climb"></dd>
                  </div>
                </dl>
              </div>
              <div class="watch__page" data-page="map">
                <svg class="watch__map" viewBox="0 0 200 52" aria-hidden="true">
                  <path class="watch__route" />
                  <path class="watch__track" pathLength="1" />
                  <circle class="watch__dot" r="5" />
                </svg>
                <dl class="watch__pair">
                  <div>
                    <dt data-text="gps.done"></dt>
                    <dd data-read="done"></dd>
                  </div>
                  <div>
                    <dt data-read="left-label"></dt>
                    <dd data-read="left"></dd>
                  </div>
                </dl>
              </div>
              <div class="watch__page" data-page="arrival">
                <span class="watch__label" data-read="arrival-label"></span>
                <strong class="watch__big" data-read="arrival"></strong>
                <p class="watch__verdict" data-read="verdict" data-late="no" hidden></p>
              </div>
              <div class="watch__page" data-page="time">
                <span class="watch__label" data-text="gps.time"></span>
                <strong class="watch__big" data-read="time"></strong>
                <dl class="watch__pair">
                  <div>
                    <dt data-text="gps.timer"></dt>
                    <dd data-read="timer"></dd>
                  </div>
                  <div>
                    <dt data-text="gps.sun"></dt>
                    <dd data-read="sun"></dd>
                  </div>
                </dl>
              </div>
              <p class="watch__paused" data-text="gps.paused"></p>
              <span class="watch__pages" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            </div>
          </div>
          <div class="watch__side">
            <p class="device__note" data-text="gps.note"></p>
          </div>
        </div>
        <div class="device" data-device="wind" role="tabpanel" hidden>
          <div class="device__body meter">
            <div class="device__screen meter__lcd" data-screen="wind" data-on="yes">
              <span class="meter__number" aria-hidden="true"></span>
              <span class="meter__line" aria-hidden="true">
                <i class="meter__icon"></i>
                <b class="meter__mode" data-mode="max" data-text="wind.lcd.max"></b>
                <b class="meter__mode" data-mode="average" data-text="wind.lcd.average"></b>
                <span class="meter__unit" data-unit="speed" data-text="wind.unit"></span>
                <span class="meter__unit" data-unit="degrees">°C</span>
              </span>
              <dl class="device__unseen">
                <div>
                  <dt data-text="wind.now"></dt>
                  <dd data-read="now"></dd>
                </div>
                <div>
                  <dt data-text="wind.strongest"></dt>
                  <dd data-read="strongest"></dd>
                </div>
                <div>
                  <dt data-text="wind.average"></dt>
                  <dd data-read="average"></dd>
                </div>
                <div>
                  <dt data-text="wind.air"></dt>
                  <dd data-read="air"></dd>
                </div>
                <div>
                  <dt data-text="wind.chill"></dt>
                  <dd data-read="chill"></dd>
                </div>
              </dl>
            </div>
          </div>
          <div class="meter__side">
            <p class="meter__name" data-read="name" role="status"></p>
            <p class="meter__risk" data-read="risk" data-warn="no"></p>
            <p class="device__note" data-text="wind.note"></p>
          </div>
        </div>
        <div class="device" data-device="tracker" role="tabpanel" hidden>
          <div class="device__body messenger">
            <div
              class="device__screen messenger__screen"
              data-tracking="no"
              data-sky="yes"
              data-shows="menu"
            >
              <p class="messenger__bar">
                <span class="messenger__battery">
                  <i aria-hidden="true"></i>
                  <span data-read="battery"></span>
                </span>
                <i class="messenger__sky" aria-hidden="true"></i>
                <span data-read="time"></span>
              </p>
              <div class="messenger__home">
                <strong class="messenger__state" data-read="state" role="status"></strong>
                <ol class="messenger__menu"></ol>
              </div>
              <div class="messenger__forecast">
                <strong data-read="forecast-of"></strong>
                <table class="messenger__table"></table>
              </div>
              <p class="messenger__status" data-read="status"></p>
              <p class="messenger__countdown">
                <span data-text="tracker.sos-countdown"></span>
                <i aria-hidden="true"></i>
              </p>
            </div>
          </div>
          <div class="tracker__side">
            <dl>
              <div>
                <dt data-text="tracker.points"></dt>
                <dd data-read="points"></dd>
              </div>
              <div>
                <dt data-text="tracker.last"></dt>
                <dd data-read="last"></dd>
              </div>
              <div>
                <dt data-text="tracker.check-ins"></dt>
                <dd data-read="check-ins"></dd>
              </div>
            </dl>
            <p class="device__note" data-text="tracker.weather-note"></p>
            <p class="device__note" data-text="tracker.note"></p>
            <p class="device__note" data-text="tracker.sos-note"></p>
          </div>
        </div>
      </section>
      <div id="joystick" hidden>
        <div id="knob"></div>
      </div>
      <p id="turn-phone"></p>
    </main>
    <p id="room" role="status" hidden>
      <span></span>
      <button type="button" class="setting-button" data-act="copy" hidden></button>
      <button type="button" class="setting-button" data-act="back" hidden></button>
    </p>
    <section id="god" role="dialog" aria-modal="false" aria-labelledby="god-title" hidden>
      <div class="god__header">
        <h2 id="god-title" data-text="title"></h2>
        <button type="button" class="god__button" data-act="close" data-text="close"></button>
      </div>
      <form class="god__row" data-form="place">
        <label for="god-place" data-text="go-to"></label>
        <select id="god-place"></select>
        <button type="submit" class="god__button" data-text="go"></button>
      </form>
      <form class="god__row" data-form="metres">
        <label for="god-metres" data-text="metres"></label>
        <input id="god-metres" type="number" min="0" step="0.5" required />
        <button type="submit" class="god__button" data-text="go"></button>
        <button type="button" class="god__button" data-act="pick" data-text="pick"></button>
      </form>
      <form class="god__row" data-form="clock">
        <label for="god-clock" data-text="clock"></label>
        <input
          id="god-clock"
          type="text"
          inputmode="numeric"
          pattern="([01][0-9]|2[0-3]):[0-5][0-9]"
          maxlength="5"
          placeholder="13:00"
          required
        />
        <button type="submit" class="god__button" data-text="set"></button>
      </form>
      <div class="god__row" data-row="speed"><span data-text="speed"></span></div>
      <div class="god__row" data-row="weather"><span data-text="weather"></span></div>
      <div class="god__row" data-row="stage"><span data-text="stage"></span></div>
      <label class="god__row god__check">
        <input type="checkbox" data-act="immortal" />
        <span data-text="immortal"></span>
      </label>
      <p class="god__note" data-text="note" role="status" aria-live="polite"></p>
      <p class="god__where" data-text="where"></p>
    </section>
    <section id="camp" role="dialog" aria-modal="true" aria-labelledby="camp-title" hidden>
      <div>
        <h2 id="camp-title"></h2>
        <p data-text="sherpa" hidden></p>
        <p data-text="where"></p>
        <p data-text="took"></p>
        <p data-text="verdict"></p>
        <dl data-text="debrief"></dl>
        <button type="button" data-text="start-over" hidden></button>
        <button type="button" data-text="continue"></button>
      </div>
    </section>
    <section id="start" role="dialog" aria-modal="true" aria-labelledby="start-title" hidden>
      <div class="menu-stage"></div>
      <div class="menu-scrim"></div>
      <div class="menu-panel">
        <div class="menu-brand">
          <p class="eyebrow" data-text="route"></p>
          <h2 id="start-title" data-text="name"></h2>
          <p class="menu-motto" data-text="motto"></p>
        </div>
        <nav class="menu-choices">
          <div class="menu-row">
            <button type="button" data-act="alone" aria-describedby="start-alone-with">
              <span class="menu-words">
                <span data-text="alone"></span>
                <small id="start-alone-with" data-text="alone-with" aria-hidden="true"></small>
              </span>
            </button>
            <button type="button" data-act="start-over" data-text="start-over" hidden></button>
          </div>
          <button type="button" data-act="together" aria-describedby="start-together-with">
            <span class="menu-words">
              <span data-text="together"></span>
              <small id="start-together-with" data-text="together-with" aria-hidden="true"></small>
            </span>
          </button>
          <form>
            <label>
              <span data-text="code"></span>
              <input
                name="code"
                maxlength="5"
                required
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
              />
            </label>
            <button type="submit" data-text="join"></button>
          </form>
        </nav>
      </div>
      <div class="menu-curtain"></div>
    </section>
    <section id="climber" role="dialog" aria-modal="true" aria-labelledby="climber-title" hidden>
      <div>
        <h2 id="climber-title" data-text="title"></h2>
        <p data-text="intro"></p>
        <dl hidden></dl>
        <form id="climber-answers" hidden>
          <div class="numbers">
            <label>
              <span data-text="age"></span>
              <input name="age" type="number" inputmode="numeric" step="1" required />
            </label>
            <label>
              <span data-text="height"></span>
              <input name="height" type="number" inputmode="numeric" step="1" required />
              <span data-text="cm"></span>
            </label>
            <label>
              <span data-text="weight"></span>
              <input name="weight" type="number" inputmode="numeric" step="1" required />
              <span data-text="kg"></span>
            </label>
          </div>
          <fieldset data-question="sex"><legend data-text="sex"></legend></fieldset>
          <fieldset data-question="training"><legend data-text="training"></legend></fieldset>
          <fieldset data-question="experience"><legend data-text="experience"></legend></fieldset>
          <fieldset data-question="illness"><legend data-text="illness"></legend></fieldset>
          <details>
            <summary data-text="conditions"></summary>
            <fieldset data-question="conditions">
              <legend data-text="conditions-legend"></legend>
            </fieldset>
          </details>
        </form>
        <div class="guide" aria-live="polite">
          <h3 data-text="guide"></h3>
          <ul></ul>
        </div>
        <button type="button" data-text="keep" hidden></button>
        <button type="button" data-text="edit" hidden></button>
        <button type="submit" form="climber-answers" data-text="climb" hidden></button>
      </div>
    </section>

          fill="none"
          stroke="#f6c445"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path d="M33 6h12a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H33z" fill="#f6c445" />

      </symbol>

          d="M27.5 33.5c-2 9-9 14-13.5 28.5"
          fill="none"
          stroke="#4aa3ff"

          stroke-linecap="round"
        />

          <rect
            x="-8.5"

            stroke="#c9d6e6"
            stroke-width="4.5"
          />
          <path d="M6.2 9.5h4.6M6.2 21.5h4.6" stroke="#0b1830" stroke-width="1.6" />
        </g>
        <path d="M41 2v9.5" fill="none" stroke="#ff8f45" stroke-width="4" stroke-linecap="round" />
      </symbol>
      <symbol id="art-ice-tool" viewBox="0 0 64 64">
        <path
          d="M46 61C46 46 42 28 31 11"
          fill="none"
          stroke="#c9d6e6"
          stroke-width="5"
          stroke-linecap="round"
        />
        <path
          d="M46 61c0-6-.6-11-1.6-16"
          fill="none"
          stroke="#ff8f45"
          stroke-width="8"
          stroke-linecap="round"
        />
        <path
          d="M34 8 13 16l-5 9 11-6 13-2z"
          fill="#8fa3bd"
          stroke="#0b1830"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
        <path
          d="M30 9l7-5 4 5-7 5z"
          fill="#8fa3bd"
          stroke="#0b1830"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
        <path
          d="M11.5 21l2.2.8M14.5 19.3l2.2.8M17.5 17.8l2.2.8"
          stroke="#0b1830"
          stroke-width="1"
        />
      </symbol>
      <symbol id="art-ice-axe" viewBox="0 0 64 64">
        <path
          d="M21 58 40 11"
          fill="none"
          stroke="#c9d6e6"
          stroke-width="4.5"
          stroke-linecap="round"
        />
        <path d="M21 58l-3 5 5-2z" fill="#8fa3bd" />
        <path
          d="M41 9 17 13l-5 8 10-5 17-1z"
          fill="#8fa3bd"
          stroke="#0b1830"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
        <path
          d="M39 9l11-2 5 7-13 1z"
          fill="#8fa3bd"
          stroke="#0b1830"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
        <path
          d="M27 43l-4 10"
