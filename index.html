<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Everest</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="slope"></div>
    <main>
      <header>
        <p id="readouts"><span>06:42</span> <span>8,412 m</span> <span>180 bar</span></p>
        <p id="fps"></p>
      </header>
      <p id="hint-click"></p>
      <p id="hint-tap"></p>
      <ol id="received"></ol>
      <div id="controls">
        <div class="menu"></div>
        <div class="oxygen"><output>3 L/min</output></div>
        <div class="thumb"></div>
      </div>
      <div id="joystick" hidden>
        <div id="knob"></div>
      </div>
      <p id="turn-phone"></p>
    </main>
    <section id="disclaimer" role="dialog" aria-modal="true" aria-labelledby="disclaimer-title">
      <div>
        <h2 id="disclaimer-title" data-text="title"></h2>
        <p data-text="course"></p>
        <p data-text="skills"></p>
        <div class="beta">
          <h3 data-text="mark"></h3>
          <p data-text="sources"></p>
        </div>
        <button type="button" data-text="understand"></button>
        <footer>
          <h1>Everest</h1>
          <p id="build"></p>
        </footer>
      </div>
    </section>
  </body>
</html>
